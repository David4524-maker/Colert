<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colert</title>
<style>
:root{--bg:#f6f4fb;--surface:#ffffff;--ink:#1d1a2b;--muted:#6b6780;--line:#e1ddee;--accent:#5b3df5;--accent-ink:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121d;--surface:#1f1c2e;--ink:#f1eefc;--muted:#a49fbd;--line:#322e48;--accent:#8c78ff;--accent-ink:#120e2b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121d;--surface:#1f1c2e;--ink:#f1eefc;--muted:#a49fbd;--line:#322e48;--accent:#8c78ff;--accent-ink:#120e2b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans CJK JP","Noto Sans Arabic",sans-serif;line-height:1.5}
.app{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:2.6rem;letter-spacing:-.04em;line-height:1;font-weight:800}
.tag{margin:6px 0 0;color:var(--muted)}
select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:.9rem}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px}
.hint{margin:0 0 14px;text-align:center;color:var(--muted);font-size:.92rem}
.wheel{position:relative;width:min(100%,440px);aspect-ratio:1;margin:0 auto;border-radius:50%;
background:radial-gradient(closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--line);touch-action:none}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;opacity:var(--dim,0);pointer-events:none}
.ball{position:absolute;width:9.5%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);
box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.25);cursor:grab;touch-action:none;z-index:2;padding:0}
.ball:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ball.drag{cursor:grabbing;transform:translate(-50%,-50%) scale(1.18)}
.wheel.mixing .ball{transition:left .9s cubic-bezier(.6,0,.3,1),top .9s cubic-bezier(.6,0,.3,1),opacity .4s .7s;left:50%!important;top:50%!important;opacity:0;pointer-events:none}
.core{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(0);border:5px solid #fff;
box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:3;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.wheel.done .core{transform:translate(-50%,-50%) scale(1)}
.controls{margin-top:20px;display:grid;gap:14px}
.row{display:flex;align-items:center;gap:12px;font-size:.92rem;color:var(--muted)}
.row input[type=range]{flex:1;accent-color:var(--accent)}
button.main,button.alt{font:inherit;font-weight:700;border-radius:14px;padding:14px 18px;cursor:pointer;border:0}
button.main{background:var(--accent);color:var(--accent-ink);font-size:1.05rem}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.result{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.result[hidden]{display:none}
.swatch{padding:34px 20px;text-align:center;transition:background .4s}
.swatch .nm{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;min-height:1.3em;overflow-wrap:anywhere}
.swatch .codes{margin-top:4px;font-size:.9rem;opacity:.85;font-variant-numeric:tabular-nums}
.panel{padding:18px;display:grid;gap:12px}
.panel h2{margin:0;font-size:1rem}
.panel input[type=text]{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.palette{margin-top:26px}
.palette h2{font-size:1.05rem;margin:0 0 10px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0;margin:0;list-style:none}
.chip{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);position:relative}
.chip i{display:block;height:54px}
.chip b{display:block;padding:8px 10px 0;font-size:.92rem;overflow-wrap:anywhere}
.chip small{display:block;padding:0 10px 9px;color:var(--muted);font-size:.78rem}
.chip button{position:absolute;top:6px;inset-inline-end:6px;border:0;background:rgba(0,0,0,.45);color:#fff;width:24px;height:24px;border-radius:50%;cursor:pointer;line-height:1}
.empty{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Colert</h1><p class="tag" data-i="tag"></p></div>
  <select id="lang" aria-label="Language"></select>
</header>

<section class="stage">
  <p class="hint" data-i="hint"></p>
  <div class="wheel" id="wheel"><div class="core" id="core"></div></div>
  <div class="controls">
    <label class="row"><span data-i="bright"></span><input type="range" id="bright" min="25" max="100" value="100"></label>
    <button class="main" id="create" data-i="create"></button>
  </div>
</section>

<section class="result" id="result" hidden>
  <div class="swatch" id="swatch"><div class="nm" id="nameShown"></div><div class="codes" id="codes"></div></div>
  <div class="panel">
    <h2 data-i="nameLbl"></h2>
    <input type="text" id="name" maxlength="40" data-ph="namePh" autocomplete="off">
    <button class="main" id="save" data-i="save"></button>
    <button class="alt" id="again" data-i="again"></button>
  </div>
</section>

<section class="palette">
  <h2 data-i="pal"></h2>
  <ul class="chips" id="chips"></ul>
  <p class="empty" id="empty" data-i="empty"></p>
</section>
</div>

<script>
const L={
es:{n:"Español",tag:"Crea tu propio color",hint:"Arrastra las 9 bolitas por la rueda",bright:"Luminosidad",create:"Crear mi color",nameLbl:"Ponle nombre",namePh:"Ej. Atardecer de Ensenada",save:"Guardar",again:"Crear otro",pal:"Mi paleta",empty:"Aún no hay colores guardados.",un:"Sin nombre"},
en:{n:"English",tag:"Create your own color",hint:"Drag the 9 dots around the wheel",bright:"Brightness",create:"Create my color",nameLbl:"Give it a name",namePh:"E.g. Ocean sunset",save:"Save",again:"Create another",pal:"My palette",empty:"No saved colors yet.",un:"Unnamed"},
pt:{n:"Português",tag:"Crie a sua própria cor",hint:"Arraste as 9 bolinhas pela roda",bright:"Luminosidade",create:"Criar minha cor",nameLbl:"Dê um nome",namePh:"Ex.: Pôr do sol",save:"Salvar",again:"Criar outra",pal:"Minha paleta",empty:"Ainda não há cores salvas.",un:"Sem nome"},
fr:{n:"Français",tag:"Créez votre propre couleur",hint:"Faites glisser les 9 pastilles sur la roue",bright:"Luminosité",create:"Créer ma couleur",nameLbl:"Donnez-lui un nom",namePh:"Ex. : Coucher de soleil",save:"Enregistrer",again:"En créer une autre",pal:"Ma palette",empty:"Aucune couleur enregistrée.",un:"Sans nom"},
de:{n:"Deutsch",tag:"Erschaffe deine eigene Farbe",hint:"Ziehe die 9 Punkte über das Farbrad",bright:"Helligkeit",create:"Meine Farbe erstellen",nameLbl:"Gib ihr einen Namen",namePh:"z. B. Meeresabend",save:"Speichern",again:"Noch eine erstellen",pal:"Meine Palette",empty:"Noch keine Farben gespeichert.",un:"Ohne Namen"},
it:{n:"Italiano",tag:"Crea il tuo colore",hint:"Trascina i 9 puntini sulla ruota",bright:"Luminosità",create:"Crea il mio colore",nameLbl:"Dagli un nome",namePh:"Es. Tramonto sul mare",save:"Salva",again:"Creane un altro",pal:"La mia tavolozza",empty:"Nessun colore salvato.",un:"Senza nome"},
ja:{n:"日本語",tag:"あなただけの色をつくろう",hint:"9つの点をカラーホイールの上でドラッグ",bright:"明るさ",create:"色をつくる",nameLbl:"名前をつける",namePh:"例：海辺の夕焼け",save:"保存",again:"もう一度つくる",pal:"マイパレット",empty:"保存した色はまだありません。",un:"名前なし"},
zh:{n:"中文",tag:"创造属于你的颜色",hint:"在色轮上拖动 9 个圆点",bright:"亮度",create:"创建我的颜色",nameLbl:"给它起个名字",namePh:"例如：海边日落",save:"保存",again:"再创建一个",pal:"我的调色板",empty:"还没有保存的颜色。",un:"未命名"},
ko:{n:"한국어",tag:"나만의 색을 만들어 보세요",hint:"색상환 위에서 9개의 점을 드래그하세요",bright:"밝기",create:"내 색 만들기",nameLbl:"이름을 지어 주세요",namePh:"예: 바다의 노을",save:"저장",again:"다시 만들기",pal:"내 팔레트",empty:"저장된 색이 아직 없어요.",un:"이름 없음"},
ar:{n:"العربية",tag:"اصنع لونك الخاص",hint:"اسحب النقاط التسع على عجلة الألوان",bright:"السطوع",create:"اصنع لوني",nameLbl:"اختر له اسمًا",namePh:"مثال: غروب البحر",save:"حفظ",again:"اصنع لونًا آخر",pal:"لوحتي",empty:"لا توجد ألوان محفوظة بعد.",un:"بدون اسم"}
};
const $=id=>document.getElementById(id);
let lang="es",V=1,mixed=null,pal=[];
const wheel=$("wheel"),core=$("core");

// language
const sel=$("lang");
Object.keys(L).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=L[k].n;sel.appendChild(o)});
function applyLang(k){
  lang=L[k]?k:"es";sel.value=lang;const t=L[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
  document.title="Colert – "+t.tag;
  renderPal();
}
sel.onchange=()=>{applyLang(sel.value);try{localStorage.setItem("colert-lang",sel.value)}catch(e){}};

// color helpers
function hsv(h,s,v){const f=n=>{const k=(n+h/60)%6;return v*(1-s*Math.max(0,Math.min(k,4-k,1)))};return[f(5),f(3),f(1)].map(x=>Math.round(x*255))}
const hex=c=>"#"+c.map(x=>x.toString(16).padStart(2,"0")).join("").toUpperCase();
const lum=c=>(.299*c[0]+.587*c[1]+.114*c[2])/255;

// balls: a = angle (deg, clockwise from top), r = 0..1 radius
const balls=[0,1,2,3,4,5,6,7,8].map(i=>({a:i*40+10,r:[.9,.62,.82,.5,.92,.68,.78,.56,.72][i]}));
const els=balls.map((b,i)=>{
  const e=document.createElement("button");e.className="ball";e.type="button";e.setAttribute("aria-label","Bolita "+(i+1));
  wheel.appendChild(e);place(b,e);bindDrag(b,e);return e;
});
function colorOf(b){return hsv(b.a,b.r,V)}
function place(b,e){
  const rad=b.a*Math.PI/180;
  e.style.left=(50+50*b.r*Math.sin(rad))+"%";
  e.style.top=(50-50*b.r*Math.cos(rad))+"%";
  e.style.background="rgb("+colorOf(b).join(",")+")";
}
function refresh(){balls.forEach((b,i)=>place(b,els[i]));wheel.style.setProperty("--dim",1-V)}
function bindDrag(b,e){
  const move=ev=>{
    const r=wheel.getBoundingClientRect(),R=r.width/2;
    const dx=ev.clientX-(r.left+R),dy=ev.clientY-(r.top+R);
    b.a=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;b.r=Math.min(1,Math.hypot(dx,dy)/R);place(b,e);
  };
  e.addEventListener("pointerdown",ev=>{e.setPointerCapture(ev.pointerId);e.classList.add("drag");move(ev);e.onpointermove=move;ev.preventDefault()});
  const end=()=>{e.classList.remove("drag");e.onpointermove=null};
  e.addEventListener("pointerup",end);e.addEventListener("pointercancel",end);
  e.addEventListener("keydown",ev=>{
    const d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[ev.key];if(!d)return;
    const rad=b.a*Math.PI/180;let x=b.r*Math.sin(rad)+d[0]*.04,y=b.r*Math.cos(rad)+d[1]*.04;
    b.a=(Math.atan2(x,y)*180/Math.PI+360)%360;b.r=Math.min(1,Math.hypot(x,y));place(b,e);ev.preventDefault();
  });
}
$("bright").oninput=ev=>{V=ev.target.value/100;refresh()};

// mixing (average in linear light)
function mix(){
  const acc=[0,0,0];
  balls.forEach(b=>colorOf(b).forEach((x,i)=>acc[i]+=Math.pow(x/255,2.2)));
  return acc.map(x=>Math.round(Math.pow(x/balls.length,1/2.2)*255));
}
$("create").onclick=()=>{
  mixed=mix();const css="rgb("+mixed.join(",")+")";
  core.style.background=css;wheel.classList.add("mixing");
  $("create").disabled=true;
  setTimeout(()=>{
    wheel.classList.add("done");
    const sw=$("swatch");sw.style.background=css;sw.style.color=lum(mixed)>.58?"#111":"#fff";
    $("codes").textContent=hex(mixed)+"  ·  rgb("+mixed.join(", ")+")";
    $("name").value="";$("nameShown").textContent="";
    $("result").hidden=false;$("result").scrollIntoView({behavior:"smooth",block:"nearest"});
    $("name").focus({preventScroll:true});
  },950);
};
$("name").oninput=e=>{$("nameShown").textContent=e.target.value};
$("again").onclick=()=>{
  wheel.classList.remove("mixing","done");$("result").hidden=true;$("create").disabled=false;
  wheel.scrollIntoView({behavior:"smooth",block:"center"});
};
$("save").onclick=()=>{
  if(!mixed)return;
  pal.unshift({name:$("name").value.trim(),hex:hex(mixed)});pal=pal.slice(0,30);
  persist();renderPal();$("nameShown").textContent=$("name").value.trim();
  $("save").animate([{transform:"scale(.95)"},{transform:"scale(1)"}],{duration:200});
};

// palette
function persist(){try{localStorage.setItem("colert-pal",JSON.stringify(pal))}catch(e){}}
function renderPal(){
  const ul=$("chips");ul.textContent="";
  pal.forEach((p,i)=>{
    const li=document.createElement("li");li.className="chip";
    const sw=document.createElement("i");sw.style.background=p.hex;
    const b=document.createElement("b");b.textContent=p.name||L[lang].un;
    const s=document.createElement("small");s.textContent=p.hex;
    const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","×");
    x.onclick=()=>{pal.splice(i,1);persist();renderPal()};
    li.append(sw,b,s,x);ul.appendChild(li);
  });
  $("empty").hidden=pal.length>0;
}
try{pal=JSON.parse(localStorage.getItem("colert-pal")||"[]");if(!Array.isArray(pal))pal=[]}catch(e){pal=[]}
let start="es";
try{start=localStorage.getItem("colert-lang")||""}catch(e){}
if(!L[start]){const n=(navigator.language||"es").slice(0,2).toLowerCase();start=L[n]?n:"es"}
refresh();applyLang(start);
</script>
</body>
</html>
